[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citation-audit"
version = "0.2.0"
description = "Inspectable citation-candidate retrieval evaluation; not a factuality classifier"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "faiss-cpu>=1.9,<2"]

[project.optional-dependencies]
models = ["transformers>=4.45,<6", "torch>=2.4,<3", "sentence-transformers>=3,<6"]
plots = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
citation-audit = "citation_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
